name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - develop
      - 'release/*'
  workflow_dispatch:
    inputs:
      force_type:
        description: 'Override type (beta or rc)'
        required: false
        default: ''
        type: choice
        options: ['', beta, rc]

env:
  REGISTRY: docker.io
  CLIENT_IMAGE_NAME: boraakgn/cyclofocus-client
  SERVER_IMAGE_NAME: boraakgn/cyclofocus-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Release Suffix
        id: suffix
        run: |
          if [[ "${{ github.event.inputs.force_type }}" != "" ]]; then
            echo "val=${{ github.event.inputs.force_type }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "val=alpha" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            if [[ "${{ github.event.head_commit.message }}" == *"#rc"* ]]; then
              echo "val=rc" >> $GITHUB_OUTPUT
            else
              echo "val=beta" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Bump version and push tag
        id: version
        uses: anothrNick/github-tag-action@1.70.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_PREFIX: v
          DEFAULT_BUMP: patch
          RELEASE_BRANCHES: main
          PRERELEASE: ${{ github.ref != 'refs/heads/main' }}
          PRERELEASE_SUFFIX: ${{ steps.suffix.outputs.val }}

      - name: Extract version from tag
        id: extract_version
        run: |
          TAG_NAME="${{ steps.version.outputs.new_tag }}"
          VERSION=${TAG_NAME#v}
          VERSION=${VERSION%-${{ steps.suffix.outputs.val }}}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"
      
      - name: Set Docker tags
        id: docker_tag
        run: |
          # Define the tag based on branch
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            # ONLY Alpha is rolling
            TAG1="${{ steps.suffix.outputs.val }}"
            TAG2="${{ steps.suffix.outputs.val }}-latest"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAG1="${{ steps.extract_version.outputs.version }}"
            TAG2="latest"
          else
            TAG1="${{ steps.suffix.outputs.val }}-${{ steps.extract_version.outputs.version }}"
            TAG2="${{ steps.suffix.outputs.val }}-latest"
          fi
          
          echo "tag1=${TAG1}" >> $GITHUB_OUTPUT
          echo "tag2=${TAG2}" >> $GITHUB_OUTPUT
          
      - name: Generate Docker metadata for client
        id: meta-client
        uses: docker/metadata-action@v5
        if: steps.version.outputs.new_tag != ''
        with:
          images: ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.docker_tag.outputs.tag1 }}
            type=raw,value=${{ steps.docker_tag.outputs.tag2 }}

      - name: Generate Docker metadata for server
        id: meta-server
        uses: docker/metadata-action@v5
        if: steps.version.outputs.new_tag != ''
        with:
          images: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.docker_tag.outputs.tag1 }}
            type=raw,value=${{ steps.docker_tag.outputs.tag2 }}

      - name: Build and push client image
        uses: docker/build-push-action@v5
        if: steps.version.outputs.new_tag != ''
        with:
          context: ./client
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE_NAME }}:buildcache,mode=max

      - name: Build and push server image
        uses: docker/build-push-action@v5
        if: steps.version.outputs.new_tag != ''
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.SERVER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.SERVER_IMAGE_NAME }}:buildcache,mode=max

      - name: Image digest
        if: steps.version.outputs.new_tag != ''
        run: |
          echo "Client image digests: ${{ steps.meta-client.outputs.tags }}"
          echo "Server image digests: ${{ steps.meta-server.outputs.tags }}"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        if: steps.version.outputs.new_tag != ''
        with:
          tag: ${{ steps.version.outputs.new_tag }}
          name: Release ${{ steps.version.outputs.new_tag }}
          generateReleaseNotes: true
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            ## 🐳 Docker Images
            
            ### Client Image
            ```
            docker pull ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE_NAME }}:${{ steps.docker_tag.outputs.tag1 }}
            ```
            
            ### Server Image
            ```
            docker pull ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE_NAME }}:${{ steps.docker_tag.outputs.tag1 }}
            ```
            
            ### Platforms
            - linux/amd64
            - linux/arm64/v8
            
            ### Quick Start
            ```bash
            docker compose pull
            docker compose up -d
            ```
            
            ---
            
            ${{ github.ref != 'refs/heads/main' && '**Note:** This is a pre-release version and may contain bugs or incomplete features.' || '' }}
