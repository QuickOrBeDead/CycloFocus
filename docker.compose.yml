services:
  app:
    build: .
    container_name: cyclo-focus-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=80
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.4.0-alpine
    container_name: cyclo-focus-redis
    command: >
      redis-server
      --appendonly yes
      --save 60 1
      --dir /data
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
